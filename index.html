<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>Ticket Management Admin Portal</title>
    <script>
      // Applies the persisted/preferred theme to <html> before Vue mounts,
      // so there is no flash of the wrong theme on a dark system (issue
      // #20 / PRD-002 "Theme"). Must read the exact same localStorage key
      // and value format `useColorMode` uses (`src/composables/useTheme.ts`
      // -- key `vueuse-color-scheme`, raw string value `'light' | 'dark' |
      // 'auto'`, no JSON quoting) or the two would disagree on first paint.
      (function () {
        try {
          var stored = localStorage.getItem('vueuse-color-scheme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var isDark = stored === 'dark' || (stored !== 'light' && prefersDark)

          if (isDark) {
            document.documentElement.setAttribute('data-theme', 'dark')
          }
        } catch (e) {
          // localStorage inaccessible (privacy mode, disabled storage): fall
          // back to the light default rather than blocking the page.
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
