server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets (Vite outputs content-hashed filenames under /assets)
    # are safe to cache forever — a new deploy ships new filenames.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must always be revalidated so a new deploy is picked up
    # immediately instead of being served from a stale cache.
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback: unknown paths (client-side routes) resolve to index.html
    # so refreshing a nested route doesn't 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
