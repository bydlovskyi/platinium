openapi: 3.1.0
info:
  title: Ticket Management Admin Portal API
  description: >
    Hand-written contract for the Ticket Management Admin Portal. This is the
    single source of truth for the API surface — types in
    `src/features/platform/api/schema.ts` are generated from this document by
    `npm run openapi-generate` and must never be hand-edited. Entity paths for
    Events, Categories and Tickets, and the authentication paths, are declared
    by their own owning slices; this document only defines the shared
    vocabulary (pagination, errors, enums, reusable parameters and responses)
    plus a trivial `/health` endpoint that proves generation and typing work
    end to end.
  version: '1.0'
servers:
  - url: /api
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness check
      description: >
        Trivial endpoint proving the mock API is installed and intercepting
        requests, and that type generation works end to end.
      tags:
        - System
      responses:
        '200':
          description: The service is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/login:
    post:
      operationId: postAuthLogin
      summary: Authenticate with email and password
      description: >
        Validates the given credentials against the mock backend's seeded
        administrator account and, on success, issues an opaque bearer token
        together with the authenticated user record.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Credentials were valid; a session token was issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      operationId: postAuthLogout
      summary: Invalidate the current session
      description: >
        Invalidates the bearer token presented on the request, so a
        subsequent request with the same token is rejected as unauthorized.
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '204':
          description: The session was invalidated.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      operationId: getAuthMe
      summary: Fetch the current session's user
      description: >
        Returns the user record associated with the bearer token presented on
        the request.
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The authenticated user record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  schemas:
    HealthStatus:
      type: object
      description: Body returned by `GET /health`.
      properties:
        status:
          type: string
          description: Literal liveness indicator.
          enum:
            - ok
      required:
        - status
      additionalProperties: false

    PaginationMeta:
      type: object
      description: >
        Shared pagination envelope metadata. Every list endpoint returns a
        `data` array alongside a `meta` object of this shape.
      properties:
        page:
          type: integer
          description: The current page number, 1-indexed.
          minimum: 1
        perPage:
          type: integer
          description: The number of items returned per page.
          minimum: 1
        total:
          type: integer
          description: The total number of items across all pages.
          minimum: 0
        totalPages:
          type: integer
          description: The total number of pages available.
          minimum: 0
      required:
        - page
        - perPage
        - total
        - totalPages
      additionalProperties: false

    ValidationError:
      type: object
      description: >
        A map of field name to a human-readable message describing why that
        field failed validation.
      additionalProperties:
        type: string

    ErrorResponse:
      type: object
      description: >
        The shared error envelope returned by every failed request: a
        machine-readable code, a human message and, for validation failures,
        a per-field message map.
      properties:
        code:
          type: string
          description: >
            Machine-readable error code, e.g. `VALIDATION_ERROR`,
            `UNAUTHORIZED`, `NOT_FOUND`, `CONFLICT`, `INTERNAL_ERROR`.
        message:
          type: string
          description: Human-readable summary of the failure.
        errors:
          allOf:
            - $ref: '#/components/schemas/ValidationError'
          description: Optional per-field validation messages.
      required:
        - code
        - message
      additionalProperties: false

    EventStatus:
      type: string
      description: Lifecycle status of an Event.
      enum:
        - draft
        - published
        - cancelled
        - completed

    TicketStatus:
      type: string
      description: Lifecycle status of a Ticket.
      enum:
        - draft
        - on_sale
        - sold_out
        - archived

    Currency:
      type: string
      description: Supported currency codes (ISO 4217). Ticket prices are restricted to this set rather than a free-form string.
      enum:
        - USD
        - EUR
        - GBP

    SortOrder:
      type: string
      description: Sort direction for any `sort` parameter.
      enum:
        - asc
        - desc

    UserRole:
      type: string
      description: >
        Role granted to an authenticated user. Currently seeded with a single
        administrator role; extended with a viewer role by PRD-007.
      enum:
        - admin

    User:
      type: object
      description: An authenticated administrator or viewer of the portal.
      properties:
        id:
          type: string
          description: Opaque unique identifier.
        name:
          type: string
          description: Display name.
        email:
          type: string
          description: Login email address.
        role:
          allOf:
            - $ref: '#/components/schemas/UserRole'
          description: The role granted to this user.
      required:
        - id
        - name
        - email
        - role
      additionalProperties: false

    LoginRequest:
      type: object
      description: Body of `POST /auth/login`.
      properties:
        email:
          type: string
          description: Login email address.
        password:
          type: string
          description: Login password.
      required:
        - email
        - password
      additionalProperties: false

    LoginResponse:
      type: object
      description: Body returned by a successful `POST /auth/login`.
      properties:
        token:
          type: string
          description: "Opaque bearer token to send as `Authorization: Bearer <token>` on subsequent requests."
        user:
          allOf:
            - $ref: '#/components/schemas/User'
          description: The authenticated user record.
      required:
        - token
        - user
      additionalProperties: false

  parameters:
    search:
      name: search
      in: query
      required: false
      description: Free-text search applied across an endpoint's declared searchable fields.
      schema:
        type: string

    sort:
      name: sort
      in: query
      required: false
      description: Field name to sort by. Valid values are declared by the owning endpoint.
      schema:
        type: string

    order:
      name: order
      in: query
      required: false
      description: Sort direction, paired with `sort`.
      schema:
        $ref: '#/components/schemas/SortOrder'

    page:
      name: page
      in: query
      required: false
      description: 1-indexed page number.
      schema:
        type: integer
        minimum: 1
        default: 1

    perPage:
      name: perPage
      in: query
      required: false
      description: Number of items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: The request failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: The session is absent or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: No resource exists with the given identifier.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Conflict:
      description: The request conflicts with the current state of the resource, e.g. a referential-integrity violation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalError:
      description: An unexpected or forced failure occurred while handling the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  securitySchemes:
    bearerAuth:
      type: http
      description: >
        Documentation-only: declares that an endpoint expects
        `Authorization: Bearer <token>`. The mock backend's MSW handlers
        (`src/mocks/handlers/auth.ts`) perform the real enforcement — this
        scheme does not, by itself, cause any request to be rejected.
      scheme: bearer
