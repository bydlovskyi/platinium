openapi: 3.1.0
info:
  title: Ticket Management Admin Portal API
  description: >
    Hand-written contract for the Ticket Management Admin Portal. This is the
    single source of truth for the API surface — types in
    `src/features/platform/api/schema.ts` are generated from this document by
    `npm run openapi-generate` and must never be hand-edited. Entity paths for
    Events, Categories and Tickets, and the authentication paths, are declared
    by their own owning slices; this document only defines the shared
    vocabulary (pagination, errors, enums, reusable parameters and responses)
    plus a trivial `/health` endpoint that proves generation and typing work
    end to end.
  version: '1.0'
servers:
  - url: /api
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness check
      description: >
        Trivial endpoint proving the mock API is installed and intercepting
        requests, and that type generation works end to end.
      tags:
        - System
      responses:
        '200':
          description: The service is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/login:
    post:
      operationId: postAuthLogin
      summary: Authenticate with email and password
      description: >
        Validates the given credentials against the mock backend's seeded
        administrator account and, on success, issues an opaque bearer token
        together with the authenticated user record.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Credentials were valid; a session token was issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      operationId: postAuthLogout
      summary: Invalidate the current session
      description: >
        Invalidates the bearer token presented on the request, so a
        subsequent request with the same token is rejected as unauthorized.
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '204':
          description: The session was invalidated.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      operationId: getAuthMe
      summary: Fetch the current session's user
      description: >
        Returns the user record associated with the bearer token presented on
        the request.
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The authenticated user record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /events:
    get:
      operationId: getEvents
      summary: List events
      description: >
        Returns a page of events, filtered and sorted per the given query
        parameters. `startDateFrom`/`startDateTo` match events whose own
        `[startDate, endDate]` range overlaps the requested window, not
        events strictly contained within it — a long-running event must not
        be hidden from the list because it started before the window began.
      tags:
        - Events
      parameters:
        - $ref: '#/components/parameters/search'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/order'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
        - name: status
          in: query
          required: false
          description: Filters to events with this exact lifecycle status.
          schema:
            $ref: '#/components/schemas/EventStatus'
        - name: country
          in: query
          required: false
          description: Filters to events with this exact ISO 3166-1 alpha-2 country code.
          schema:
            type: string
        - name: startDateFrom
          in: query
          required: false
          description: >
            Lower bound of the requested date window, inclusive. Matched by
            overlap against each event's own `[startDate, endDate]` range,
            not containment.
          schema:
            type: string
            format: date
        - name: startDateTo
          in: query
          required: false
          description: >
            Upper bound of the requested date window, inclusive. Matched by
            overlap against each event's own `[startDate, endDate]` range,
            not containment.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: A page of events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'

    post:
      operationId: postEvents
      summary: Create an event
      description: Creates a new event from the given payload.
      tags:
        - Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventPayload'
      responses:
        '201':
          description: The event was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'

  /events/{id}:
    get:
      operationId: getEventsId
      summary: Fetch an event
      description: Returns a single event by id.
      tags:
        - Events
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The event record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      operationId: patchEventsId
      summary: Partially update an event
      description: Applies a partial update to an existing event.
      tags:
        - Events
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventPayload'
      responses:
        '200':
          description: The updated event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      operationId: deleteEventsId
      summary: Delete an event
      description: >
        Deletes an event, unless another entity still depends on it — cascade
        deletion is deliberately not supported; the caller must resolve or
        remove the dependents first.
      tags:
        - Events
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: The event was deleted.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >
            The event cannot be deleted because another entity (e.g. a
            ticket) still references it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DependencyConflict'
components:
  schemas:
    HealthStatus:
      type: object
      description: Body returned by `GET /health`.
      properties:
        status:
          type: string
          description: Literal liveness indicator.
          enum:
            - ok
      required:
        - status
      additionalProperties: false

    PaginationMeta:
      type: object
      description: >
        Shared pagination envelope metadata. Every list endpoint returns a
        `data` array alongside a `meta` object of this shape.
      properties:
        page:
          type: integer
          description: The current page number, 1-indexed.
          minimum: 1
        perPage:
          type: integer
          description: The number of items returned per page.
          minimum: 1
        total:
          type: integer
          description: The total number of items across all pages.
          minimum: 0
        totalPages:
          type: integer
          description: The total number of pages available.
          minimum: 0
      required:
        - page
        - perPage
        - total
        - totalPages
      additionalProperties: false

    ValidationError:
      type: object
      description: >
        A map of field name to a human-readable message describing why that
        field failed validation.
      additionalProperties:
        type: string

    ErrorResponse:
      type: object
      description: >
        The shared error envelope returned by every failed request: a
        machine-readable code, a human message and, for validation failures,
        a per-field message map.
      properties:
        code:
          type: string
          description: >
            Machine-readable error code, e.g. `VALIDATION_ERROR`,
            `UNAUTHORIZED`, `NOT_FOUND`, `CONFLICT`, `INTERNAL_ERROR`.
        message:
          type: string
          description: Human-readable summary of the failure.
        errors:
          allOf:
            - $ref: '#/components/schemas/ValidationError'
          description: Optional per-field validation messages.
      required:
        - code
        - message
      additionalProperties: false

    EventStatus:
      type: string
      description: Lifecycle status of an Event.
      enum:
        - draft
        - published
        - cancelled
        - completed

    TicketStatus:
      type: string
      description: Lifecycle status of a Ticket.
      enum:
        - draft
        - on_sale
        - sold_out
        - archived

    Currency:
      type: string
      description: Supported currency codes (ISO 4217). Ticket prices are restricted to this set rather than a free-form string.
      enum:
        - USD
        - EUR
        - GBP

    SortOrder:
      type: string
      description: Sort direction for any `sort` parameter.
      enum:
        - asc
        - desc

    UserRole:
      type: string
      description: >
        Role granted to an authenticated user. Currently seeded with a single
        administrator role; extended with a viewer role by PRD-007.
      enum:
        - admin

    User:
      type: object
      description: An authenticated administrator or viewer of the portal.
      properties:
        id:
          type: string
          description: Opaque unique identifier.
        name:
          type: string
          description: Display name.
        email:
          type: string
          description: Login email address.
        role:
          allOf:
            - $ref: '#/components/schemas/UserRole'
          description: The role granted to this user.
      required:
        - id
        - name
        - email
        - role
      additionalProperties: false

    LoginRequest:
      type: object
      description: Body of `POST /auth/login`.
      properties:
        email:
          type: string
          description: Login email address.
        password:
          type: string
          description: Login password.
      required:
        - email
        - password
      additionalProperties: false

    LoginResponse:
      type: object
      description: Body returned by a successful `POST /auth/login`.
      properties:
        token:
          type: string
          description: "Opaque bearer token to send as `Authorization: Bearer <token>` on subsequent requests."
        user:
          allOf:
            - $ref: '#/components/schemas/User'
          description: The authenticated user record.
      required:
        - token
        - user
      additionalProperties: false

    Event:
      type: object
      description: An event administrators create tickets against.
      properties:
        id:
          type: string
          description: Opaque unique identifier.
        name:
          type: string
          description: Display name.
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code, e.g. `US`.
        venue:
          type: string
          description: Venue name.
        startDate:
          type: string
          format: date
          description: ISO 8601 date string, no time component.
        endDate:
          type: string
          format: date
          description: ISO 8601 date string, no time component.
        status:
          allOf:
            - $ref: '#/components/schemas/EventStatus'
          description: The event's lifecycle status.
        createdAt:
          type: string
          format: date-time
          description: When the record was created.
        updatedAt:
          type: string
          format: date-time
          description: When the record was last updated.
      required:
        - id
        - name
        - country
        - venue
        - startDate
        - endDate
        - status
        - createdAt
        - updatedAt
      additionalProperties: false

    EventPayload:
      type: object
      description: >
        The writable subset of an Event, shared by `POST /events` (full
        create) and `PATCH /events/{id}` (partial update). Deliberately
        carries no `required` list: OpenAPI's `required` is schema-wide, not
        per-operation, so a list here would force every field on a PATCH too,
        defeating "partial". Which fields are mandatory for create instead of
        update is enforced at runtime by the mock handler's `validate`
        function (`src/mocks/handlers/events.ts`) — do not add `required`
        back to this schema; add stricter runtime validation instead.
      properties:
        name:
          type: string
          description: Display name.
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code, e.g. `US`.
        venue:
          type: string
          description: Venue name.
        startDate:
          type: string
          format: date
          description: ISO 8601 date string, no time component.
        endDate:
          type: string
          format: date
          description: ISO 8601 date string, no time component.
        status:
          allOf:
            - $ref: '#/components/schemas/EventStatus'
          description: The event's lifecycle status.
      additionalProperties: false

    EventListResponse:
      type: object
      description: Body returned by `GET /events`.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        meta:
          allOf:
            - $ref: '#/components/schemas/PaginationMeta'
          description: Pagination metadata for the returned page.
      required:
        - data
        - meta
      additionalProperties: false

    DependencyConflict:
      description: >
        The shared error envelope, extended with the blocking dependent
        entity's type and count, so a `409` on delete carries enough
        information for an administrator to act on it instead of a bare
        refusal. Introduced by the Events contract (PRD-004) and reused by
        the Categories contract (PRD-005).
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            entity:
              type: string
              description: The type of the blocking dependent entity, e.g. `ticket`.
            count:
              type: integer
              minimum: 1
              description: The number of dependent records blocking the operation.
          required:
            - entity
            - count
          additionalProperties: false

  parameters:
    search:
      name: search
      in: query
      required: false
      description: Free-text search applied across an endpoint's declared searchable fields.
      schema:
        type: string

    sort:
      name: sort
      in: query
      required: false
      description: Field name to sort by. Valid values are declared by the owning endpoint.
      schema:
        type: string

    order:
      name: order
      in: query
      required: false
      description: Sort direction, paired with `sort`.
      schema:
        $ref: '#/components/schemas/SortOrder'

    page:
      name: page
      in: query
      required: false
      description: 1-indexed page number.
      schema:
        type: integer
        minimum: 1
        default: 1

    perPage:
      name: perPage
      in: query
      required: false
      description: Number of items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: The request failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: The session is absent or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: No resource exists with the given identifier.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Conflict:
      description: The request conflicts with the current state of the resource, e.g. a referential-integrity violation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalError:
      description: An unexpected or forced failure occurred while handling the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  securitySchemes:
    bearerAuth:
      type: http
      description: >
        Documentation-only: declares that an endpoint expects
        `Authorization: Bearer <token>`. The mock backend's MSW handlers
        (`src/mocks/handlers/auth.ts`) perform the real enforcement — this
        scheme does not, by itself, cause any request to be rejected.
      scheme: bearer
